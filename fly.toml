app = 'cars24-api'
primary_region = 'sin'

[build]
  dockerfile = 'backend/Cars24Api/Dockerfile'

[http_service]
  internal_port = 5170
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
